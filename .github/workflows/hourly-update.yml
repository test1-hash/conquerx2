name: hourly-update

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run_build: ${{ steps.decision.outputs.should_run_build }}
      should_update: ${{ steps.decision.outputs.should_update }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether this run should fetch
        id: decision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run_build=true" >> "$GITHUB_OUTPUT"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "reason=non-schedule event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from urllib import request
          from zoneinfo import ZoneInfo

          jst = ZoneInfo("Asia/Tokyo")
          now = datetime.now(tz=jst)
          should_update = True
          if now.minute < 5:
              target = now.replace(minute=5, second=0, microsecond=0)
              reason = f"wait_until_{target.strftime('%Y-%m-%dT%H:%M')}"
          else:
              reason = f"fetch_now_{now.strftime('%Y-%m-%dT%H:%M')}"

          state = None
          repository = os.environ.get("GITHUB_REPOSITORY")
          if should_update and repository:
              state_url = f"https://raw.githubusercontent.com/{repository}/main/data/state.json"
              try:
                  with request.urlopen(state_url, timeout=20) as response:
                      state = json.load(response)
              except Exception:
                  state = None

          state_path = Path("data/state.json")
          if should_update and state is None and state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))

          if should_update and state is not None:
              snapshots = state.get("snapshots", [])
              if snapshots:
                  latest = max(snapshots, key=lambda item: item["captured_at_utc"])
                  latest_dt = datetime.fromisoformat(latest["captured_at_utc"]).astimezone(jst)
                  if latest_dt.year == now.year and latest_dt.month == now.month and latest_dt.day == now.day and latest_dt.hour == now.hour:
                      should_update = False
                      reason = f"already_fetched_{latest_dt.strftime('%Y-%m-%dT%H:%M')}"

          should_run_build = should_update
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"should_run_build={'true' if should_run_build else 'false'}\n")
              fh.write(f"should_update={'true' if should_update else 'false'}\n")
              fh.write(f"reason={reason}\n")
          print(f"should_run_build={should_run_build}")
          print(f"should_update={should_update}")
          print(f"reason={reason}")
          PY

  build:
    needs: gate
    if: needs.gate.outputs.should_run_build == 'true'
    outputs:
      did_build: ${{ steps.final_gate.outputs.do_build }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize fetch timing
        id: final_gate
        shell: bash
        env:
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          GATE_SHOULD_UPDATE: ${{ needs.gate.outputs.should_update }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime
          from pathlib import Path
          from urllib import request
          from zoneinfo import ZoneInfo

          def load_state() -> dict | None:
              repository = os.environ.get("GITHUB_REPOSITORY")
              if repository:
                  state_url = f"https://raw.githubusercontent.com/{repository}/main/data/state.json"
                  try:
                      with request.urlopen(state_url, timeout=20) as response:
                          return json.load(response)
                  except Exception:
                      pass
              state_path = Path("data/state.json")
              if state_path.exists():
                  return json.loads(state_path.read_text(encoding="utf-8"))
              return None

          def latest_snapshot_dt(state: dict | None, jst: ZoneInfo) -> datetime | None:
              snapshots = (state or {}).get("snapshots", [])
              if not snapshots:
                  return None
              latest = max(snapshots, key=lambda item: item["captured_at_utc"])
              return datetime.fromisoformat(latest["captured_at_utc"]).astimezone(jst)

          def same_hour(left: datetime, right: datetime) -> bool:
              return (
                  left.year == right.year
                  and left.month == right.month
                  and left.day == right.day
                  and left.hour == right.hour
              )

          event_name = os.environ["GITHUB_EVENT_NAME"]
          gate_should_update = os.environ.get("GATE_SHOULD_UPDATE") == "true"
          reason = os.environ.get("GATE_REASON") or ""
          do_build = event_name != "schedule"
          do_update = False

          jst = ZoneInfo("Asia/Tokyo")
          if event_name == "schedule" and gate_should_update:
              now = datetime.now(tz=jst)
              if now.minute < 5:
                  target = now.replace(minute=5, second=0, microsecond=0)
                  sleep_seconds = max(0, int((target - now).total_seconds()))
                  if sleep_seconds:
                      print(f"Waiting {sleep_seconds}s until {target.isoformat()} JST before fetch")
                      time.sleep(sleep_seconds)

              now = datetime.now(tz=jst)
              latest_dt = latest_snapshot_dt(load_state(), jst)
              if latest_dt and same_hour(latest_dt, now):
                  do_build = False
                  do_update = False
                  reason = f"already_fetched_{latest_dt.strftime('%Y-%m-%dT%H:%M')}"
              else:
                  do_build = True
                  do_update = True
                  reason = f"fetching_{now.strftime('%Y-%m-%dT%H:%M')}"
          elif event_name != "schedule":
              do_build = True
              do_update = False
              reason = reason or "non-schedule build"

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"do_build={'true' if do_build else 'false'}\n")
              fh.write(f"do_update={'true' if do_update else 'false'}\n")
              fh.write(f"reason={reason}\n")
          print(f"do_build={do_build}")
          print(f"do_update={do_update}")
          print(f"reason={reason}")
          PY

      - name: Configure GitHub Pages
        if: steps.final_gate.outputs.do_build == 'true'
        uses: actions/configure-pages@v5

      - name: Set up Python
        if: steps.final_gate.outputs.do_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.final_gate.outputs.do_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update ranking and build static site
        if: steps.final_gate.outputs.do_update == 'true'
        env:
          CX2_GAME_COOKIE: ${{ secrets.CX2_GAME_COOKIE }}
          CX2_GAME_USERID: ${{ secrets.CX2_GAME_USERID }}
          CX2_GAME_PASSWORD: ${{ secrets.CX2_GAME_PASSWORD }}
          CX2_GAME_SERVER_ID: ${{ secrets.CX2_GAME_SERVER_ID }}
          CX2_GAME_NICKNAME: ${{ secrets.CX2_GAME_NICKNAME }}
          CX2_GAME_DIRECTION: ${{ secrets.CX2_GAME_DIRECTION }}
          CX2_GAME_PREFER_BRANCH: ${{ secrets.CX2_GAME_PREFER_BRANCH }}
          CX2_GAME_SOURCE_URL: ${{ secrets.CX2_GAME_SOURCE_URL }}
          CX2_SOURCE_URL: ${{ secrets.CX2_SOURCE_URL }}
          CX2_SERVER_RANK_URL: ${{ secrets.CX2_SERVER_RANK_URL }}
        run: python manage.py update

      - name: Build static site from current state
        if: steps.final_gate.outputs.do_build == 'true' && steps.final_gate.outputs.do_update != 'true'
        run: python manage.py build

      - name: Commit and push changes
        if: steps.final_gate.outputs.do_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update CX2 rankings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload GitHub Pages artifact
        if: steps.final_gate.outputs.do_build == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.did_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
